name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Unique release name (leave blank for auto)'
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-user-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name || github.ref_name }}-user-registry
      release_description: 'dMessage UserRegistry gasless contract'
      relative_path: '["contracts/gasless"]'
      package: 'user_registry_gasless'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-social-graph:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name || github.ref_name }}-social-graph
      release_description: 'dMessage SocialGraph gasless contract'
      relative_path: '["contracts/gasless"]'
      package: 'social_graph_gasless'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-messages:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ inputs.release_name || github.ref_name }}-messages
      release_description: 'dMessage Messages gasless contract'
      relative_path: '["contracts/gasless"]'
      package: 'messages_gasless'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
